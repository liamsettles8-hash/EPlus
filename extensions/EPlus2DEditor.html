<!doctype html><html><head><meta charset="utf-8"><title>E#+ 2D Editor</title><style>body{margin:0;background:#151820;color:#eee;font:14px Segoe UI}header{padding:12px;background:#202531;display:flex;gap:8px;align-items:center}button,input{padding:8px;background:#303746;color:#fff;border:1px solid #505b70;border-radius:6px}main{display:flex;height:calc(100vh - 58px)}aside{width:230px;padding:14px;background:#1c212b}canvas{margin:20px;background:#fff;cursor:crosshair}</style></head><body><header><b>E#+ 2D Editor</b><button id="new">New</button><button id="clear">Clear</button><button id="save">Export PNG</button><label>Color <input id="color" type="color" value="#111111"></label><label>Size <input id="size" type="number" value="8" min="1" max="100"></label></header><main><aside><h3>Image editor</h3><p>Draw on the canvas and export a PNG for your E#+ project.</p><button data-tool="pen">Pen</button> <button data-tool="eraser">Eraser</button></aside><canvas id="c" width="900" height="600"></canvas></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),color=document.getElementById('color'),size=document.getElementById('size');let down=false,tool='pen';function bg(){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}bg();c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture(e.pointerId);draw(e)});c.addEventListener('pointerup',()=>down=false);c.addEventListener('pointermove',e=>{if(down)draw(e)});function draw(e){const r=c.getBoundingClientRect();x.fillStyle=tool==='eraser'?'#fff':color.value;x.beginPath();x.arc(e.clientX-r.left,e.clientY-r.top,Math.max(1,Number(size.value)||8),0,Math.PI*2);x.fill()}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>tool=b.dataset.tool);document.getElementById('clear').onclick=bg;document.getElementById('new').onclick=()=>{c.width=900;c.height=600;bg()};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='eplus-image.png';a.href=c.toDataURL('image/png');a.click()};</script></body></html>
